<meta name="theme-color" content="#035B36">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#F2F8F4; --surface:#FFFFFF; --field:#F7FBF9; --plate:#FFFFFF; --cab:#FFFFFF;
  --line:#DBE9E1; --line-2:#EAF3EE;
  --ink:#0B2A1D; --muted:#4F6B5F; --faint:#7D978B;
  --brand:#035B36; --brand-2:#0A6E44; --on-brand:#FFFFFF;
  --leaf:#0BC875; --mint:#2ED48A; --mint-soft:#E3F7EC;
  --sun:#FDC528; --on-sun:#063C24;
  --accent:#06794A; --pos:#0A8F55; --neg:#C2412D;
  --text:var(--ink); --rule:var(--line); --rule-soft:var(--line-2);
  --bar:var(--brand); --bar-text:#FFFFFF; --bar-soft:#A6D8BF;
  --ocre:var(--sun); --ocre-on:var(--on-sun); --carmin:var(--neg); --verde:var(--pos); --gold:var(--sun);
  --r-card:20px; --r-ctl:13px;
  --sombra:0 1px 2px rgba(3,91,54,.06), 0 6px 18px -10px rgba(3,91,54,.22);
  --sombra-2:0 18px 40px -18px rgba(3,91,54,.45);
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-seal:cubic-bezier(.2,1.25,.4,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06140E; --surface:#0D2119; --field:#0A1B14; --plate:#F2F8F4; --cab:#EEF7F2;
  --line:#1D3A2D; --line-2:#152E23;
  --ink:#E4F3EB; --muted:#9CBCAC; --faint:#6E8F80;
  --brand:#046B40; --brand-2:#0A7C4C; --mint-soft:#10301F;
  --accent:#4FD99A; --pos:#4FD99A; --neg:#F08A78; --bar-soft:#9FD4BA;
  --sombra:0 1px 2px rgba(0,0,0,.4); --sombra-2:0 18px 40px -18px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{--bg:#06140E;--surface:#0D2119;--field:#0A1B14;--plate:#F2F8F4;--cab:#EEF7F2;
  --line:#1D3A2D;--line-2:#152E23;--ink:#E4F3EB;--muted:#9CBCAC;--faint:#6E8F80;--brand:#046B40;--brand-2:#0A7C4C;
  --mint-soft:#10301F;--accent:#4FD99A;--pos:#4FD99A;--neg:#F08A78;--bar-soft:#9FD4BA}

*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;font-weight:500;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:-.02em;line-height:1.12}
button{font-family:inherit}
img{max-width:100%}
.tnum{font-variant-numeric:tabular-nums}
.oculto{display:none !important}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}

/* ---------- cabecera ---------- */
.cabecera{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;box-shadow:0 6px 20px -14px rgba(3,91,54,.5)}
.cab-in{background:var(--cab);border-bottom:1px solid var(--line-2)}
.cab-fila{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:9px;background:none;border:none;padding:0;cursor:pointer}
.logo .ic{width:40px;height:40px}
.logo .pal{height:26px;width:auto}
.yo{display:flex;align-items:center;gap:10px}
.pill-saldo{display:flex;align-items:center;gap:8px;background:#E3F7EC;color:#035B36;border:none;border-radius:99px;
  padding:7px 14px 7px 8px;font-weight:900;font-size:14.5px;cursor:pointer;font-family:inherit}
.pill-saldo .mas{width:24px;height:24px;border-radius:50%;background:#035B36;color:#fff;display:grid;place-items:center;
  font-size:16px;line-height:1}
.avatar{width:36px;height:36px;border-radius:50%;background:#035B36;color:#fff;display:grid;place-items:center;
  font-weight:900;font-size:14px}
.barra{background:var(--brand);color:var(--bar-text)}
.barra-in{max-width:1320px;margin:0 auto;padding:7px 14px}
.cinta{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}
.cinta::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:5px 14px 5px 6px;cursor:pointer;color:inherit;
  transition:background-color 150ms var(--ease-out)}
@media(hover:hover) and (pointer:fine){.chip:hover{background:rgba(255,255,255,.16)}}
.chip .em{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.chip .em svg{width:20px;height:20px}
.chip .tx{line-height:1.2;text-align:left}
.chip .tx b{display:block;font-size:15px;font-weight:900;color:var(--sun);white-space:nowrap}
.chip .tx span{font-size:11px;color:var(--bar-soft);white-space:nowrap;font-weight:700}
@media(max-width:620px){.logo .pal{height:22px}.logo .ic{width:34px;height:34px}.cab-fila{padding:8px 14px}}

/* ---------- rejilla ---------- */
.contenedor{max-width:1320px;margin:0 auto;padding:24px 20px;display:grid;gap:22px;grid-template-columns:1fr}
@media(max-width:620px){.contenedor{padding:16px 14px}}
@media(min-width:1060px){.contenedor{grid-template-columns:300px minmax(0,1fr) 320px;align-items:start}
  body{padding-bottom:48px}.nav-inf{display:none}.col-izq,.col-der{position:sticky;top:132px}}

/* ---------- tarjetas ---------- */
.tarjeta{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--sombra);overflow:hidden}
.tarjeta+.tarjeta{margin-top:16px}
.t-cab{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;
  align-items:center;gap:10px;min-height:54px}
.t-cab h2{font-size:15.5px;letter-spacing:-.01em}
.t-cab.oscura{background:var(--brand);color:#fff;border-bottom:none}
.t-cab.oscura select{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);
  border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:700;padding:5px 9px}
.t-cab.oscura select option{color:#0B2A1D}
.liga{font-size:13px;color:var(--accent);font-weight:800;cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
.t-cuerpo{padding:18px}

.emblema{background:#fff;border-radius:50%;display:grid;place-items:center;flex:none;
  box-shadow:inset 0 0 0 2px var(--tono,var(--line))}
.emblema svg{width:62%;height:62%}

/* ---------- destacado del catálogo ---------- */
.saludo{margin:2px 0 16px}
.saludo h2{font-size:clamp(24px,5.4vw,32px)}
.saludo p{margin:4px 0 0;color:var(--muted);font-size:15px;font-weight:600}
.destacado{position:relative;overflow:hidden;background:var(--brand);color:#fff;border-radius:26px;
  padding:24px 22px 22px;box-shadow:var(--sombra-2);margin-bottom:16px;isolation:isolate}
.destacado .marca-agua{position:absolute;right:-60px;bottom:-70px;width:320px;opacity:.16;z-index:-1;pointer-events:none}
.dest-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.etiqueta{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:99px;
  padding:5px 12px;font-size:12px;font-weight:800;letter-spacing:.01em}
.reloj-pill{background:var(--sun);color:var(--on-sun);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:800}
.dest-tit{font-size:20px;margin-top:16px;font-weight:900;color:#CFF3E1}
.pozo-num{font-size:clamp(42px,11vw,64px);font-weight:900;letter-spacing:-.035em;line-height:1;color:var(--sun);
  margin:4px 0 8px;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.dest-sub{margin:0 0 18px;font-size:15px;font-weight:600;color:#D7F2E4;max-width:460px}
.mini-balotas{display:flex;gap:10px;margin-bottom:20px}
.mini-balotas .balota{width:52px;flex:none;pointer-events:none}
.dest-acc{display:flex;gap:10px;flex-wrap:wrap}
.dest-acc .btn{width:auto;flex:1;min-width:170px;margin:0}

/* ---------- tarjeta de juego secundaria ---------- */
.juego{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-card);padding:18px;margin-bottom:14px;box-shadow:var(--sombra);
  transition:transform 160ms var(--ease-out),box-shadow 160ms var(--ease-out)}
@media(hover:hover) and (pointer:fine){.juego:hover{transform:translateY(-2px);box-shadow:var(--sombra-2)}}
.juego .emblema{width:54px;height:54px}
.juego .info{flex:1;min-width:0}
.juego .nom{font-size:13px;color:var(--muted);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-weight:700}
.juego .nom b{color:var(--ink);font-weight:900}
.juego .val{font-size:clamp(26px,6vw,32px);font-weight:900;letter-spacing:-.03em;line-height:1.05;margin:3px 0;color:var(--brand)}
.juego .cuando{font-size:12.5px;color:var(--faint);font-weight:600}
.juego .reloj{color:var(--accent);font-weight:800}
.btn-jugar{flex:none;border:none;color:var(--on-sun);background:var(--sun);font-weight:900;font-size:13.5px;
  padding:12px 20px;border-radius:var(--r-ctl);cursor:pointer;font-family:inherit;
  transition:transform 120ms var(--ease-out),filter 140ms var(--ease-out)}
.btn-jugar:active{transform:scale(.96)}
@media(hover:hover) and (pointer:fine){.btn-jugar:hover{filter:brightness(1.05)}}
@media(max-width:430px){.juego{flex-wrap:wrap}.btn-jugar{width:100%}}

.confianza{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
.confianza div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px;
  display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.35}
.confianza b{color:var(--ink);font-weight:900;font-size:13.5px}
.confianza svg{width:22px;height:22px;color:var(--leaf)}
@media(max-width:520px){.confianza{grid-template-columns:1fr}}

/* ---------- filas ---------- */
.fila{display:flex;align-items:center;gap:12px;padding:12px 18px;border:none;border-bottom:1px solid var(--line-2);
  width:100%;text-align:left;background:none;color:var(--ink);font-size:14px;cursor:pointer;font-family:inherit;font-weight:700;
  transition:background-color 130ms var(--ease-out)}
.fila:last-child{border-bottom:none}
.fila .em{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;
  box-shadow:inset 0 0 0 2px var(--tono,var(--line))}
.fila .em svg{width:19px;height:19px}
.fila .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.fila .vl{font-weight:900;white-space:nowrap;color:var(--brand)}
@media(hover:hover) and (pointer:fine){.fila:hover{background:var(--field)}}

/* ---------- botones ---------- */
.btn{display:block;width:100%;font-weight:900;font-size:15px;padding:14px 16px;border-radius:var(--r-ctl);
  border:none;background:var(--brand);color:#fff;cursor:pointer;font-family:inherit;
  transition:transform 110ms var(--ease-out),filter 140ms var(--ease-out),opacity 140ms var(--ease-out)}
.btn:active{transform:scale(.985)}
@media(hover:hover) and (pointer:fine){.btn:hover{filter:brightness(1.08)}}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.btn.oro,.btn.sol{background:var(--sun);color:var(--on-sun)}
.btn.linea{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-weight:800}
.btn.fantasma{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35);font-weight:800}
.btn.mini{padding:11px 14px;font-size:13.5px}
.btn+.btn{margin-top:10px}
.duo{display:flex;gap:10px}.duo .btn{margin-top:0}
.btn-4k{display:flex;align-items:center;justify-content:center;gap:9px}

.login-logo{display:flex;justify-content:center;padding:4px 0 14px}
.login-logo img{width:210px}
.social{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.social button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:var(--r-ctl);
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:800;font-size:13.5px;font-family:inherit}
.social button[disabled]{opacity:.55;cursor:not-allowed}
.social svg{width:18px;height:18px;flex:none}
.divisor{height:1px;background:var(--line);margin:18px 0}
.recuerda{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 0;font-size:12.5px}
.recuerda label{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600}
.recuerda input{width:16px;height:16px;accent-color:var(--brand)}
.pie-legal{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:16px;font-size:12px;color:var(--faint);font-weight:700}
.mas18{border:1.5px solid var(--faint);border-radius:6px;padding:1px 6px;font-weight:900;font-size:11px}
.nota{font-size:12.5px;color:var(--faint);line-height:1.55;margin:12px 0 0;font-weight:600}

/* ---------- campos ---------- */
.campo{margin-bottom:14px}
.campo label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
.campo .aux{font-weight:600;color:var(--muted)}
.campo input,.campo select,.campo textarea{width:100%;font-family:inherit;font-size:16px;font-weight:600;padding:12px 14px;
  border-radius:var(--r-ctl);border:1.5px solid var(--line);background:var(--field);color:var(--ink);
  transition:border-color 130ms var(--ease-out),box-shadow 130ms var(--ease-out)}
.campo textarea{min-height:170px;font-size:13px;line-height:1.55;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 4px rgba(11,200,117,.16)}
.campo input::placeholder{color:var(--faint)}
.err{color:var(--neg);font-size:13px;font-weight:800;margin:12px 0 0}

/* ---------- pantalla de jugar ---------- */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;padding:22px 20px;background:var(--brand);color:#fff;isolation:isolate}
.hero .emblema{width:54px;height:54px;box-shadow:none}
.hero .val{font-size:clamp(30px,7vw,40px);font-weight:900;letter-spacing:-.03em;line-height:1.02;margin:3px 0 4px;color:var(--sun)}
.hero .nom{font-size:13px;color:#CFF3E1;font-weight:800}
.hero .cuando{font-size:12.5px;color:#CFF3E1;font-weight:600}
.paso{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.paso b{font-size:12.5px;font-weight:900;color:var(--on-sun);background:var(--sun);width:24px;height:24px;
  border-radius:50%;display:grid;place-items:center;flex:none}
.paso span{font-size:14px;color:var(--ink);font-weight:800}
.accion{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--surface);
  border-top:1px solid var(--line-2);margin:20px -18px -18px;padding:14px 18px}
@media(min-width:1060px){.accion{bottom:0}}
.accion .rot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:700}

/* ---------- dígitos ---------- */
.digitos{display:flex;gap:10px;justify-content:center;margin:6px 0}
.casilla{flex:1;max-width:74px;aspect-ratio:3/4;display:grid;place-items:center;background:var(--field);
  border:2px solid var(--line);border-radius:14px;font-size:clamp(32px,10vw,44px);font-weight:900;color:var(--brand);
  transition:border-color 150ms var(--ease-out),box-shadow 150ms var(--ease-out)}
.casilla.vacia{color:var(--line)}
.casilla.activa{border-color:var(--leaf);box-shadow:0 0 0 4px rgba(11,200,117,.16)}
.casilla .d.entra{animation:subir 170ms var(--ease-out)}
@keyframes subir{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.tecla{font-weight:900;font-size:20px;padding:14px 0;border:1.5px solid var(--line);border-radius:var(--r-ctl);
  background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit;
  transition:transform 110ms var(--ease-out),background-color 130ms var(--ease-out)}
.tecla.aux{font-size:13.5px;color:var(--accent)}
.tecla:active{transform:scale(.96);background:var(--mint-soft)}
@media(hover:hover) and (pointer:fine){.tecla:hover{background:var(--mint-soft)}}

/* ---------- balotas ---------- */
.rejilla{display:grid;gap:10px;margin:8px 0}
.rejilla.r43{grid-template-columns:repeat(7,minmax(0,1fr))}
@media(min-width:680px){.rejilla.r43{grid-template-columns:repeat(9,minmax(0,1fr))}}
.balota{position:relative;aspect-ratio:1;border:none;padding:0;cursor:pointer;border-radius:50%;
  background:
    radial-gradient(circle at 34% 26%, rgba(255,255,255,.97) 0%, rgba(255,255,255,.42) 12%, rgba(255,255,255,0) 38%),
    radial-gradient(circle at 74% 82%, rgba(0,0,0,.24) 0%, rgba(0,0,0,0) 55%),
    radial-gradient(circle at 40% 33%, #FFFFFF 0%, #F4F6F2 44%, #B7C0B9 100%);
  box-shadow:0 4px 8px -4px rgba(3,58,34,.5), inset 0 -4px 10px -6px rgba(0,0,0,.3);
  transition:transform 160ms var(--ease-out),box-shadow 160ms var(--ease-out)}
.balota::after{content:attr(data-n);position:absolute;inset:21%;border-radius:50%;
  background:radial-gradient(circle at 40% 32%, #FFFFFF 0%, #EEF2EE 100%);box-shadow:inset 0 1px 2px rgba(3,58,34,.2);
  display:grid;place-items:center;color:#035B36;font-weight:900;font-size:clamp(11px,2.7vw,15px);letter-spacing:-.02em;
  font-family:'Nunito',sans-serif}
.balota:active{transform:scale(.92)}
@media(hover:hover) and (pointer:fine){.balota:hover{transform:translateY(-2px)}}
.balota.elegida{transform:scale(1.07);
  box-shadow:0 0 0 3.5px var(--sun), 0 7px 14px -5px rgba(3,58,34,.55), inset 0 -4px 10px -6px rgba(0,0,0,.3)}
.balota[disabled]{opacity:.28;cursor:not-allowed;box-shadow:none}
.balota[disabled]::after{text-decoration:line-through}
.rejilla.r100{grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.rejilla.r100 .balota::after{inset:16%;font-size:clamp(8px,1.9vw,11px)}
.partido{border-bottom:1px solid var(--line-2);padding:14px 0}
.partido:last-of-type{border-bottom:none}
.partido .eq{font-size:14px;font-weight:800;margin-bottom:9px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{padding:12px 0;border:1.5px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink);
  font-weight:900;font-size:15px;cursor:pointer;font-family:inherit;
  transition:background-color 130ms var(--ease-out),color 130ms var(--ease-out),border-color 130ms var(--ease-out),transform 110ms var(--ease-out)}
.opt:active{transform:scale(.96)}
.opt.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sub-tit{font-size:13px;font-weight:900;color:var(--muted);margin:6px 2px 10px;letter-spacing:.01em}
.tira{display:flex;gap:12px;justify-content:center;margin:8px 0 6px;flex-wrap:wrap}
.tira .balota{width:clamp(52px,16vw,68px)}
.tira-caja{background:var(--mint-soft);border-radius:18px;padding:16px 10px 12px;margin-bottom:10px}

/* ---------- boleta ---------- */
.boleta{position:relative;background:var(--field);border:1.5px solid var(--line);border-radius:var(--r-card);padding:24px 18px}
.sello{position:absolute;top:14px;right:16px;background:var(--sun);color:var(--on-sun);border-radius:99px;
  font-size:11.5px;font-weight:900;padding:5px 12px;animation:sellar 420ms var(--ease-seal) both}
@keyframes sellar{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.gigante{font-size:clamp(46px,15vw,64px);font-weight:900;line-height:1;text-align:center;letter-spacing:-.02em;color:var(--brand);margin:14px 0 8px}
.dato{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.dato:last-child{border-bottom:none}
.dato span:first-child{color:var(--muted);font-weight:600}
.dato span:last-child{font-weight:800;text-align:right}
.previa{width:100%;border:1.5px solid var(--line);border-radius:var(--r-card);margin-top:14px;display:block}
#lienzo{display:none}

/* ---------- resultados ---------- */
.res{padding:15px 18px;border-bottom:1px solid var(--line-2)}
.res:last-child{border-bottom:none}
.res .enc{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:10px;align-items:center}
.res .enc b{font-weight:900}
.res .cif{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.res .cif .balota{width:34px;pointer-events:none}
.res .cif .caja{font-weight:900;font-size:16px;background:var(--mint-soft);color:var(--brand);border-radius:9px;padding:4px 10px}

.marca-estado{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap}
.gana{color:#063C24;background:#C9F2DD}.pierde{color:var(--muted);background:var(--line-2)}.espera{color:#6B4E00;background:#FFF1C2}

/* ---------- misc ---------- */
.vacio{padding:32px 18px;text-align:center;color:var(--faint);font-size:14px;line-height:1.6;font-weight:600}
.aviso{background:var(--mint-soft);border-radius:var(--r-ctl);padding:13px 15px;font-size:13px;color:var(--muted);line-height:1.6;margin-top:14px;font-weight:600}
.tabla{width:100%;border-collapse:collapse;font-size:13px}
.tabla th{text-align:left;font-size:12px;color:var(--faint);font-weight:800;padding:8px 6px;border-bottom:1.5px solid var(--line)}
.tabla th:not(:first-child),.tabla td:not(:first-child){text-align:right}
.tabla td{padding:10px 6px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tabla td.n{font-weight:900;color:var(--brand)}
.metricas{display:flex;gap:18px;flex-wrap:wrap;padding-bottom:18px}
.metricas div{flex:1;min-width:88px;background:var(--mint-soft);border-radius:14px;padding:12px 14px}
.metricas b{display:block;font-size:26px;font-weight:900;letter-spacing:-.02em;line-height:1.15;color:var(--brand)}
.metricas span{font-size:12px;color:var(--muted);font-weight:700}
.aforo{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:7px}
.aforo i{display:block;height:100%;background:var(--leaf);border-radius:3px}
.prob{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.prob:last-child{border-bottom:none}
.prob span{color:var(--muted);font-weight:600}
.prob b{font-weight:900;white-space:nowrap;color:var(--brand)}

/* ---------- sorteo ---------- */
.escenario{position:fixed;inset:0;z-index:90;background:rgba(3,40,24,.94);display:grid;place-items:center;padding:26px;
  animation:aparecer 200ms var(--ease-out) both}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
.escenario .caja{max-width:440px;width:100%;text-align:center;color:#fff}
.escenario h3{font-size:22px;margin-bottom:5px}
.escenario p{font-size:14px;opacity:.7;margin:0 0 26px;font-weight:600}
.escenario .tira{gap:14px;min-height:72px}
.escenario .balota{width:clamp(50px,16vw,66px);opacity:0;transform:scale(.4) translateY(-26px)}
.escenario .balota.cae{animation:caer 520ms var(--ease-seal) forwards}
@keyframes caer{60%{opacity:1;transform:scale(1.12) translateY(6px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.escenario .cerrar{margin-top:30px;background:var(--sun);border:none;color:var(--on-sun);border-radius:var(--r-ctl);
  padding:12px 24px;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit}

/* ---------- nav inferior ---------- */
.nav-inf{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -8px 24px -18px rgba(3,91,54,.4)}
.nav-inf button{background:none;border:none;color:var(--faint);padding:10px 4px 11px;font-size:11px;font-weight:800;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit}
.nav-inf button.on{color:var(--brand)}
.nav-inf button.on svg{color:var(--leaf)}
.nav-inf svg{width:22px;height:22px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms !important;transition-duration:1ms !important}
  .escenario .balota{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="cabecera">

function faltan(iso){
  if(!iso) return "";
  const d=new Date(iso)-Date.now();
  if(d<=0) return "cerrado";
  const min=Math.floor(d/6e4),h=Math.floor(min/60),dd=Math.floor(h/24);
  if(dd>=1) return "en "+dd+" día"+(dd>1?"s":"");
  if(h>=1) return "en "+h+" h "+(min%60)+" m";
  return "en "+min+" min";
}

  const s=e.target.closest("[data-sorteo]");if(s){return animarSorteo(s.dataset.sorteo,s.dataset.ganador)}
  const n=e.target.closest("[data-vista]");if(n){if(n.dataset.vista==="comojuega")juegoGuia=juegoGuia||CONFIG.juegos[0].id;return ir(n.dataset.vista)}
  const j=e.target.closest("[data-ir]");if(j)return abrirJuego(j.dataset.ir);
});
function ir(v){vista=v;if(v!=="jugar")juegoActivo=null;pintarNav();pintarCentro();window.scrollTo({top:0})}
function abrirJuego(id){
  juegoActivo=juegoDe(id);vista="jugar";
  sel={digitos:Array(juegoActivo.digitos||4).fill(null),numeros:[],pronos:{}};
  pintarNav();pintarCentro();window.scrollTo({top:0});
}

function pintarCentro(){
  const c=$("#centro");
  if(vista==="jugar"&&juegoActivo){c.innerHTML=vistaJugar(juegoActivo);return montarJugar()}
  if(vista==="boleta"){c.innerHTML=vistaBoleta();return montarBoleta()}
  if(vista==="boletas"){c.innerHTML=vistaMisBoletas();return}
  if(vista==="saldo"){c.innerHTML=vistaSaldo();return montarSaldo()}
  if(vista==="resultados"){c.innerHTML=`<section class="tarjeta"><div class="t-cab"><h2>Resultados</h2></div>${htmlResultados()}</section>`;return}
  if(vista==="comojuega"){c.innerHTML=vistaComoJuega();return}
  if(vista==="control"){c.innerHTML=vistaControl();return montarControl()}
  c.innerHTML=vistaCatalogo();
}

function montarJugar(){
  const j=juegoActivo;
  ({digitos:mDigitos,seleccion:mSeleccion,tablero:mTablero,quiniela:mQuiniela}[j.tipo])(j);
  $("#btnConfirmar").addEventListener("click",confirmarJugada);
}
function mDigitos(j){
  const cont=$("#cas");
  const pintar=()=>{
    const act=sel.digitos.indexOf(null);
    cont.innerHTML=sel.digitos.map((v,i)=>
      `<div class="casilla ${v===null?"vacia":""} ${i===act?"activa":""}"><span class="d">${v===null?"0":v}</span></div>`).join("");
    $("#pistaJ").textContent=sel.digitos.every(x=>x!==null)?"Tu número: "+sel.digitos.join(""):"Toca los dígitos.";
  };
  const poner=v=>{
    let i=sel.digitos.indexOf(null);
    if(i===-1){sel.digitos=sel.digitos.slice(1).concat(v);i=sel.digitos.length-1}else sel.digitos[i]=v;
    pintar();
    const d=cont.children[i]&&cont.children[i].querySelector(".d");
    if(d){d.classList.remove("entra");void d.offsetWidth;d.classList.add("entra")}
  };
  const t=$("#tec");t.innerHTML="";
  const k=(x,f,a)=>{const b=document.createElement("button");b.type="button";
    b.className="tecla"+(a?" aux":"");b.textContent=x;b.addEventListener("click",f);return b};
  [1,2,3,4,5,6,7,8,9].forEach(n=>t.appendChild(k(String(n),()=>poner(n))));
  t.appendChild(k("Borrar",()=>{let i=sel.digitos.length-1;while(i>=0&&sel.digitos[i]===null)i--;if(i>=0)sel.digitos[i]=null;pintar()},true));
  t.appendChild(k("0",()=>poner(0)));
  t.appendChild(k("Al azar",()=>{sel.digitos=sel.digitos.map(()=>Math.floor(Math.random()*10));pintar()},true));
  pintar();
}
function mSeleccion(j){
  const r=$("#rej"),tira=$("#tira");
  const pintar=()=>{
    r.innerHTML="";
    for(let n=1;n<=j.rango;n++){
      const b=document.createElement("button");
      b.className="balota"+(sel.numeros.includes(n)?" elegida":"");
      b.dataset.n=String(n).padStart(2,"0");b.type="button";b.setAttribute("aria-label","Número "+n);
      b.addEventListener("click",()=>{
        const i=sel.numeros.indexOf(n);
        if(i>=0)sel.numeros.splice(i,1);else if(sel.numeros.length<j.escoger)sel.numeros.push(n);
        pintar();
      });
      r.appendChild(b);
    }
    tira.innerHTML="";
    const ord=[...sel.numeros].sort((a,b)=>a-b);
    for(let i=0;i<j.escoger;i++){
      const v=ord[i],b=document.createElement("div");
      b.className="balota"+(v!==undefined?" elegida":"");
      b.dataset.n=v!==undefined?String(v).padStart(2,"0"):"·";
      if(v===undefined)b.style.opacity=".35";
      tira.appendChild(b);
    }
    $("#pistaJ").textContent=sel.numeros.length===j.escoger?"Tus 4 balotas están listas.":"Te faltan "+(j.escoger-sel.numeros.length)+" balota(s).";
  };
  $("#btnAzar").addEventListener("click",()=>{
    const p=[];while(p.length<j.escoger){const n=1+Math.floor(Math.random()*j.rango);if(!p.includes(n))p.push(n)}
    sel.numeros=p;pintar();
  });
  pintar();
}
function mTablero(j){
  const r=$("#rej");
  const tomadas=new Set(todasBoletas.filter(b=>b.juego===j.id).map(b=>b.jugada));
  const pintar=()=>{
    r.innerHTML="";
    for(let n=0;n<j.casillas;n++){
      const et=String(n).padStart(2,"0"),b=document.createElement("button");
      b.className="balota"+(sel.numeros[0]===et?" elegida":"");
      b.dataset.n=et;b.type="button";
      if(tomadas.has(et))b.disabled=true;
      b.addEventListener("click",()=>{sel.numeros=[et];pintar()});
      r.appendChild(b);
    }
    $("#pistaJ").textContent=(sel.numeros[0]?"Tu boleta: "+sel.numeros[0]+" · ":"")+(j.casillas-tomadas.size)+" libres de "+j.casillas;
  };
  $("#btnAzar").addEventListener("click",()=>{
    const l=[];for(let n=0;n<j.casillas;n++){const e=String(n).padStart(2,"0");if(!tomadas.has(e))l.push(e)}
    if(l.length){sel.numeros=[l[Math.floor(Math.random()*l.length)]];pintar()}
  });
  pintar();
}
function mQuiniela(j){
  const marcar=(p,o)=>{
    sel.pronos[p]=o;
    $("#centro").querySelectorAll('.opt[data-p="'+p+'"]').forEach(x=>x.classList.toggle("on",x.dataset.o===o));
    const n=Object.keys(sel.pronos).length;
    $("#pistaJ").textContent=n===j.partidos.length?"Quiniela completa.":"Te faltan "+(j.partidos.length-n)+" partido(s).";
  };
  $("#centro").querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>marcar(b.dataset.p,b.dataset.o)));
  $("#btnAzar").addEventListener("click",()=>j.partidos.forEach((_,i)=>marcar(String(i),["1","X","2"][Math.floor(Math.random()*3)])));
  $("#pistaJ").textContent="Marca 1, X o 2 en cada partido.";
}

function jugadaTexto(j){
  if(j.tipo==="digitos")   return sel.digitos.every(d=>d!==null)?sel.digitos.join(""):null;
  if(j.tipo==="seleccion") return sel.numeros.length===j.escoger?[...sel.numeros].sort((a,b)=>a-b).map(n=>String(n).padStart(2,"0")).join("-"):null;
  if(j.tipo==="tablero")   return sel.numeros[0]||null;
  if(j.tipo==="quiniela")  return Object.keys(sel.pronos).length===j.partidos.length?j.partidos.map((_,i)=>sel.pronos[i]).join(""):null;
  return null;
}
const falloJ=m=>{const e=$("#errJ");e.textContent=m;e.classList.remove("oculto")};

async function confirmarJugada(){
  const j=juegoActivo;$("#errJ").classList.add("oculto");
  const jugada=jugadaTexto(j);
  if(!jugada) return falloJ("Completa tu jugada antes de confirmar.");
  const nombre=$("#inNom").value.trim(),correo=$("#inMail").value.trim();
  if(nombre.length<3) return falloJ("Escribe el nombre que va en la boleta.");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo)) return falloJ("Revisa el correo: no parece una dirección válida.");
  if(!cuenta) return falloJ("No se pudo leer tu cuenta. Recarga la página.");
  if(cuenta.saldo<j.precio) return falloJ("Saldo insuficiente. Te faltan "+cop(j.precio-cuenta.saldo)+".");

  const btn=$("#btnConfirmar");btn.disabled=true;btn.textContent="Registrando…";
  const boleta={uid,juego:j.id,juegoNombre:j.nombre,jugada,nombre,correo,precio:j.precio,
    cierre:j.cierre,fuente:j.fuente,creado:new Date().toISOString(),notificado:false};
  try{
    if(db){
      if(j.unico){
        const ref=db.doc("reservas/"+j.id+"_"+jugada);
        const l=await ref.acquire({holder:sesion,ttlMs:8000});
        if(!l.acquired) throw new Error("ocupado");
        const s=await ref.get();
        if(s.exists&&s.data()&&s.data().uid) throw new Error("ocupado");
        await ref.set({juego:j.id,jugada,uid,creado:boleta.creado});
      }
      await db.collection("boletas").add(boleta);
      cuenta.saldo-=j.precio;cuenta.nombre=nombre;cuenta.correo=correo;
      cuenta.movimientos=(cuenta.movimientos||[]).concat([{t:"jugada",m:-j.precio,d:j.nombre+" · "+jugada,f:boleta.creado}]).slice(-40);
      await db.doc("data/users/"+uid+"/cuenta").set(cuenta);
    }
  }catch(err){
    btn.disabled=false;btn.textContent="Jugar por "+cop(j.precio);
    return falloJ(String(err.message)==="ocupado"?"Alguien acaba de tomar esa jugada. Escoge otra.":"No se pudo registrar. Revisa tu conexión.");
  }
  ultimaBoleta=boleta;vista="boleta";pintarNav();pintarCentro();pintarSesion();window.scrollTo({top:0});
}

/* ---------- verificador ---------- */
function resultadoDe(id){return resultados.find(r=>r.juego===id)}
function evaluar(b){
  const j=juegoDe(b.juego),r=resultadoDe(b.juego);
  if(!j||!r) return {estado:"espera",texto:"En juego"};
  const gan=String(r.ganador).trim();
  if(j.tipo==="digitos"){
    const g=gan.replace(/\D/g,""),m=String(b.jugada);
    if(g.slice(-4)===m) return {estado:"gana",texto:"Las 4 cifras"};
    if(g.slice(-3)===m.slice(-3)) return {estado:"gana",texto:"Las 3 últimas"};
    if(g.slice(-2)===m.slice(-2)) return {estado:"gana",texto:"Las 2 últimas"};
    return {estado:"pierde",texto:"Sin acierto"};
  }
  if(j.tipo==="seleccion"){
    const g=gan.split(/[\s\-·,]+/).map(Number),m=String(b.jugada).split("-").map(Number);
    const a=m.filter(n=>g.includes(n)).length;
    if(a>=4) return {estado:"gana",texto:"¡Pozo acumulado!"};
    if(a===3) return {estado:"gana",texto:"3 balotas · $500.000"};
    if(a===2) return {estado:"gana",texto:"2 balotas · juegas gratis"};
    return {estado:"pierde",texto:a===1?"1 balota":"Sin acierto"};
  }
  if(j.tipo==="tablero"){
    const g=gan.replace(/\D/g,"").slice(-2);
    return g===String(b.jugada) ? {estado:"gana",texto:"¡Ganaste la moto!"} : {estado:"pierde",texto:"Sin acierto"};
  }
  if(j.tipo==="quiniela"){
    const g=gan.replace(/[^12Xx]/g,"").toUpperCase(),m=String(b.jugada).toUpperCase();
    let a=0;for(let i=0;i<m.length;i++) if(g[i]===m[i]) a++;
    if(a>=4) return {estado:"gana",texto:a+" aciertos"};
    return {estado:"pierde",texto:a+" acierto"+(a===1?"":"s")};
  }
  return {estado:"espera",texto:"En juego"};
}

/* ---------- animación del sorteo ---------- */
function animarSorteo(idJuego,ganador){
  const j=juegoDe(idJuego)||{nombre:idJuego};
  const partes=String(ganador).trim().split(/[\s\-·,]+/);
  const lista = partes.length>1 ? partes : String(ganador).split("");
  const wrap=document.createElement("div");
  wrap.className="escenario";
  wrap.innerHTML=`<div class="caja"><h3>${esc(j.nombre)}</h3><p>Resultado del sorteo</p>
    <div class="tira" id="tiraSorteo"></div>
    <button class="cerrar">Cerrar</button></div>`;
  document.body.appendChild(wrap);
  const t=wrap.querySelector("#tiraSorteo");
  lista.forEach((v,i)=>{
    const b=document.createElement("div");
    b.className="balota";b.dataset.n=v;
    t.appendChild(b);
    setTimeout(()=>b.classList.add("cae"), 180+i*260);
  });
  const cerrar=()=>{wrap.remove()};
  wrap.querySelector(".cerrar").addEventListener("click",cerrar);
  wrap.addEventListener("click",e=>{if(e.target===wrap)cerrar()});
}

  return {tipo:"cajas",lista:String(b.jugada).split("")};
}

    <button class="liga" data-vista="juegos">Ir al catálogo</button></div>

/* ---------- boleta 2160 × 2700 ---------- */
function mez(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,Math.max(0,((n>>16)&255)+f)),g=Math.min(255,Math.max(0,((n>>8)&255)+f)),b=Math.min(255,Math.max(0,(n&255)+f));
  return "rgb("+r+","+g+","+b+")";
}
function balotaCanvas(x,cx,cy,r,texto){
  const base="#F2F4F0";
  x.save();
  x.beginPath();x.ellipse(cx,cy+r*.95,r*.74,r*.17,0,0,7);x.fillStyle="rgba(14,46,43,.2)";x.fill();
  const g=x.createRadialGradient(cx-r*.3,cy-r*.34,r*.05,cx,cy,r*1.08);
  g.addColorStop(0,mez(base,10));g.addColorStop(.46,base);g.addColorStop(1,mez(base,-66));
  x.beginPath();x.arc(cx,cy,r,0,7);x.fillStyle=g;x.fill();
  const s=x.createRadialGradient(cx-r*.36,cy-r*.44,0,cx-r*.36,cy-r*.44,r*.44);
  s.addColorStop(0,"rgba(255,255,255,.9)");s.addColorStop(1,"rgba(255,255,255,0)");
  x.beginPath();x.arc(cx,cy,r,0,7);x.fillStyle=s;x.fill();
  const d=x.createRadialGradient(cx-r*.18,cy-r*.22,r*.05,cx,cy,r*.6);
  d.addColorStop(0,"#FFFEFA");d.addColorStop(1,"#EFE7D6");
  x.beginPath();x.arc(cx,cy,r*.58,0,7);x.fillStyle=d;x.fill();
  x.fillStyle="#035B36";x.textAlign="center";x.textBaseline="middle";
  x.font="900 "+Math.round(r*.6)+"px 'Nunito', sans-serif";
  x.fillText(texto,cx,cy+r*.02);x.textBaseline="alphabetic";x.restore();
}
function dibujar(b){
  const j=juegoDe(b.juego)||{},pz=piezas(b);
  const c=$("#lienzo"),x=c.getContext("2d");
  x.setTransform(2,0,0,2,0,0);
  const W=1080,H=1350,stock="#F2F8F4",tinta="#035B36",suave="#4F6B5F",carmin="#035B36",jt="#0BC875";
  x.fillStyle=stock;x.fillRect(0,0,W,H);
  x.fillStyle="rgba(11,200,117,.07)";
  for(let i=30;i<W;i+=44)for(let k=30;k<H;k+=44){x.beginPath();x.arc(i,k,2.3,0,7);x.fill()}
  x.fillStyle=jt;x.fillRect(42,42,W-84,18);
  x.strokeStyle=tinta;x.lineWidth=5;x.strokeRect(42,42,W-84,H-84);
  x.strokeStyle="rgba(3,91,54,.25)";x.lineWidth=1.4;x.strokeRect(60,60,W-120,H-120);

  x.textAlign="center";x.fillStyle=tinta;
  if(_logoImg){const lw=440,lh=_logoImg.height*lw/_logoImg.width;x.drawImage(_logoImg,(W-lw)/2,78,lw,lh)}
  else{x.font="900 58px 'Nunito', sans-serif";x.fillText(CONFIG.marca,W/2,152)}
  x.fillStyle=jt;x.font="700 31px 'Nunito', sans-serif";
  x.fillText(b.juegoNombre,W/2,222);
  x.strokeStyle=tinta;x.lineWidth=2.4;x.setLineDash([11,9]);
  x.beginPath();x.moveTo(140,250);x.lineTo(W-140,250);x.stroke();x.setLineDash([]);
  x.fillStyle=suave;x.font="500 28px 'Nunito', sans-serif";
  x.fillText("boleta a nombre de",W/2,300);
  x.fillStyle=tinta;x.font="700 54px 'Nunito', sans-serif";
  let nom=b.nombre;while(x.measureText(nom).width>W-200&&nom.length>4)nom=nom.slice(0,-1);
  x.fillText(nom,W/2,364);
  x.fillStyle=suave;x.font="500 28px 'Nunito', sans-serif";
  x.fillText("juega con",W/2,446);

  const base=496;let alto;
  if(pz.tipo==="balotas"){
    const n=pz.lista.length,r=Math.min(96,Math.floor((W-300)/(n*2.35))),sep=r*2.42,tot=(n-1)*sep;
    let cx=W/2-tot/2;
    pz.lista.forEach(v=>{balotaCanvas(x,cx,base+r+14,r,v);cx+=sep});
    alto=r*2+38;
  }else{
    const n=pz.lista.length,an=Math.min(152,Math.floor((W-260)/n)-20),sep=20,al=Math.round(an*1.3),tot=n*an+(n-1)*sep;
    let px=(W-tot)/2;
    pz.lista.forEach(v=>{
      x.fillStyle="#FCF8ED";x.fillRect(px,base,an,al);
      x.strokeStyle=tinta;x.lineWidth=4;x.strokeRect(px,base,an,al);
      x.fillStyle=tinta;x.font="700 "+Math.round(an*.8)+"px 'Nunito', sans-serif";
      x.textBaseline="middle";x.fillText(v,px+an/2,base+al/2);x.textBaseline="alphabetic";
      px+=an+sep;
    });
    alto=al;
  }

  let y=base+alto+94;
  const linea=(a,v)=>{
    x.textAlign="left";x.fillStyle=suave;x.font="500 27px 'Nunito', sans-serif";x.fillText(a,120,y);
    x.textAlign="right";x.fillStyle=tinta;x.font="600 27px 'Nunito', sans-serif";
    let t=v;while(x.measureText(t).width>520&&t.length>6)t=t.slice(0,-1);
    x.fillText(t,W-120,y);y+=24;
    x.strokeStyle="rgba(14,46,43,.2)";x.lineWidth=1.5;
    x.beginPath();x.moveTo(120,y);x.lineTo(W-120,y);x.stroke();y+=42;
  };
  linea("Cierra",b.cierre);
  linea("Se define con",b.fuente);
  linea("Premio mayor",j.pozoTexto||cop(j.pozo||0));

  x.save();x.translate(W/2,H-188);x.rotate(-.2);
  x.strokeStyle=carmin;x.lineWidth=6;x.strokeRect(-188,-46,376,92);
  x.fillStyle=carmin;x.textAlign="center";x.font="700 48px 'Nunito', sans-serif";
  x.textBaseline="middle";x.fillText("CONFIRMADA",0,3);x.restore();

  x.textAlign="center";x.textBaseline="alphabetic";
  x.fillStyle=suave;x.font="500 24px 'Nunito', sans-serif";
  x.fillText(CONFIG.organizador+" · "+CONFIG.ciudad,W/2,H-78);
  return c;
}

function dibujar4K(b){
  const c=document.createElement("canvas");c.width=3840;c.height=2160;
  const x=c.getContext("2d"),W=3840,H=2160;
  x.fillStyle="#F2F8F4";x.fillRect(0,0,W,H);
  const v=x.createRadialGradient(W/2,H*.6,240,W/2,H*.6,W*.7);
  v.addColorStop(0,"rgba(255,255,255,.85)");v.addColorStop(1,"rgba(11,200,117,.10)");
  x.fillStyle=v;x.fillRect(0,0,W,H);
  x.fillStyle="#035B36";x.fillRect(0,H-150,W,150);
  x.fillStyle="#FDC528";x.fillRect(0,H-156,W,8);
  if(_logoImg){const lw=1060,lh=_logoImg.height*lw/_logoImg.width;x.drawImage(_logoImg,170,120,lw,lh)}
  x.textBaseline="alphabetic";x.textAlign="right";x.fillStyle="#035B36";x.font="900 62px 'Nunito', sans-serif";
  let nom=b.nombre;while(x.measureText(nom).width>1400&&nom.length>4)nom=nom.slice(0,-1);
  x.fillText(nom,W-200,272);
  x.fillStyle="#4F6B5F";x.font="700 46px 'Nunito', sans-serif";x.fillText(b.juegoNombre+"  ·  "+b.cierre,W-200,350);
  const lista=String(b.jugada).split("-"),n=lista.length,r=340,sep=r*2.36,tot=(n-1)*sep;
  let cx=W/2-tot/2;const cy=H*.585;
  lista.forEach(t=>{balotaCanvas(x,cx,cy,r,t);cx+=sep});
  x.textAlign="center";x.fillStyle="#FFFFFF";x.font="800 52px 'Nunito', sans-serif";
  x.fillText("Tus 4 balotas para el "+b.fuente+"  ·  "+CONFIG.lema,W/2,H-58);
  return c;
}

async function iniciarFirebase(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs=firebase.firestore(), auth=firebase.auth();
  try{await auth.getRedirectResult()}catch(e){console.error(e)}
  const u=await new Promise(res=>{const un=auth.onAuthStateChanged(x=>{un();res(x)})});
  if(!u){mostrarLogin(auth);return null}
  const owner=!!(u.email===ADMIN_EMAIL&&u.emailVerified);
  const quitarLogin=()=>{const l=document.getElementById("loginSuerteo");if(l)l.remove()};
  quitarLogin();
  const db={
    doc:(p)=>{const r=fs.doc(p);return{
      get:()=>r.get(),
      set:(d)=>r.set(d),
      update:(d)=>r.update(d),
      acquire:()=>fs.runTransaction(async t=>{const s=await t.get(r);if(s.exists)return{acquired:false};t.set(r,{uid:null,reservando:true});return{acquired:true};})
    }},
    collection:(n)=>fs.collection(n)
  };
  const usuario={id:async()=>u.uid,me:async()=>({name:u.displayName||"Jugador",correo:u.email||""}),isOwner:()=>owner};
  const descargas={save:async({filename,data})=>{
    const blob=data instanceof Blob?data:new Blob([data],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);}};
  return{db,usuario,descargas};
}
